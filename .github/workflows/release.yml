name: Release to npm

# Strict release pipeline for the noy-db-at sealing-key providers.
#
# Triggered on GitHub Release `published`. Runs the full verification
# gate (install + build + lint + typecheck + test) on a clean checkout
# at the release tag, and only publishes if every gate passes.
#
# Publishes with `--provenance` so the npm registry attests a
# verifiable cryptographic link between the tarball and this workflow
# run (supply-chain integrity). Requires `id-token: write` permission
# on the job.
#
# ── npm dist-tag routing ─────────────────────────────────────────────
#
#   • `latest` — the default install (`pnpm add @noy-db/at-env`). Used
#     for stable themed releases.
#   • `next`   — opt-in early-adopter channel (`pnpm add @noy-db/at-env@next`).
#
# Routing rules:
#   - `release` event with `prerelease: true` (the "Set as a pre-release"
#     checkbox on the GitHub Release form) → publishes with `--tag next`.
#   - `release` event with `prerelease: false` → publishes with `--tag latest`.
#   - Manual `workflow_dispatch` → uses the `tag` input (default `latest`).
#
# Both paths preserve `--provenance` and the strict verification gate.
# The chosen tag is echoed to the workflow log + the run summary before
# any publish runs, so an unintended target shows up immediately.
#
# Setup required (one-time, in repo Settings → Secrets and variables):
#   - NPM_TOKEN (npm automation token with publish access to @noy-db/*)
#   - GitHub Actions must have "Read and write permissions" under
#     Settings → Actions → General → Workflow permissions
#
# Manual dispatch is available for first-publish or re-publish debugging;
# it requires typing PUBLISH into the confirm field so accidental triggers
# can't publish by mistake. The `tag` input lets a maintainer override
# the dist-tag without touching this file.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm manual trigger'
        required: true
        default: ''
      tag:
        description: 'npm dist-tag (latest | next | canary | rc | beta | alpha)'
        required: false
        default: 'latest'
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Gate 1: strict verification ──────────────────────────────────────
  verify:
    name: Verify (strict)
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.confirm == 'PUBLISH' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Architecture invariants
        run: pnpm check:architecture

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # ── Version gates ────────────────────────────────────────────────
      #
      # This repo has no changesets: `pnpm version:set <v>` moves every package
      # at once, and these three steps are what make that safe.
      #
      # ⚠️ This REPLACES a step ported from noy-db-to that read the version from
      # the ROOT package.json as "the lockstep canonical for the repo". That is
      # true there and false here: this repo's root manifest is `private: true`
      # and carries NO version field, so `node -p "require('./package.json')
      # .version"` evaluated to the string "undefined", never matched any tag,
      # and would have failed every release before it reached publish. The
      # ported comment said per-package enforcement would be "added when stores
      # land" — the packages landed at extraction and the step was never
      # revisited.
      - name: One version line across the workspace
        run: pnpm check:versions-uniform

      # Every PUBLISHABLE package must match the tag. Reading the version from
      # the packages rather than from a root canonical is what makes this true
      # of what actually gets published.
      - name: Verify package versions match release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          node -e "
            const { readdirSync, readFileSync, existsSync } = require('node:fs')
            const want = process.argv[1]
            const dirs = readdirSync('.').filter(
              (d) => !d.startsWith('.') && d !== 'node_modules' && d !== 'scripts' &&
                     existsSync(d + '/package.json'))
            const pkgs = dirs.map((d) => JSON.parse(readFileSync(d + '/package.json', 'utf8')))
                             .filter((j) => !j.private)
            if (!pkgs.length) { console.error('no publishable packages found'); process.exit(1) }
            const bad = pkgs.filter((j) => j.version !== want)
            for (const j of bad) console.error('  ' + j.name + '@' + j.version + ' != tag ' + want)
            if (bad.length) {
              console.error('\n' + bad.length + ' of ' + pkgs.length + ' package(s) do not match the release tag.')
              process.exit(1)
            }
            console.log('all ' + pkgs.length + ' package(s) at ' + want + ', matching release tag v' + want)
          " "$VERSION"

      # The executable form of "git is not npm", in the direction that bit this
      # repo: the REGISTRY ran ahead of the source. Core published 0.7.0 for the
      # whole lockstep line after this repo's extraction snapshot, so all five
      # manifests said 0.7.0-pre.17 while npm carried 0.7.0. Every local gate was
      # green, because every local gate reads only local state.
      #
      # Exit 2 means "could not confirm" (registry unreachable), which is NOT
      # the same as "free to publish" and fails the job rather than waving it on.
      - name: This version is not already published
        run: pnpm check:not-already-published

      # The dist-tag is routed entirely by the "Set as a pre-release" checkbox on
      # the Release form, so a forgotten tick publishes a pre-release to @latest.
      # Recovery is awkward but NOT impossible from CI, and the distinction
      # matters now that align-dist-tags.mjs in this repo depends on it:
      # `npm dist-tag add` DOES work with the automation token (verified by
      # klum-db against the live registry), because that token bypasses 2FA. It
      # is the LOCAL `~/.npmrc` path that needs an interactive OTP. `npm
      # deprecate` is a different endpoint and has NOT been tested this way —
      # do not widen this into "account-changing writes are automatable".
      #
      # WHY THE GUARD, stated as the rule rather than as a repo's condition.
      #
      # @latest is the default install. A pre-release landing there is served to
      # everyone who types `pnpm add @noy-db/at-env` with no tag, and moving a
      # dist-tag afterwards does not un-ship what was installed in the meantime.
      # The tag is also load-bearing for align-dist-tags.mjs in this repo.
      #
      # The same end state is reachable by a route NO guard can catch: npm sets
      # `latest` on a package's FIRST publish regardless of --tag, so a package
      # debuting mid-preline pins @latest to a pre-release and later `--tag next`
      # publishes never move it. Only publishing a stable fixes that. This step
      # cannot prevent it; it prevents the case that IS preventable.
      #
      # ⚠️ The justification this comment used to carry was ported from noy-db-to
      # and every clause of it was false here, MEASURED 2026-09-01: it claimed
      # "all 17 at-*@0.5.0 versions are deprecated" and that repair needed "a
      # stable release, which is blocked". This repo has FIVE packages, not 17;
      # `npm view <pkg>@0.5.0 deprecated` is empty for all five (controlled
      # against a known-deprecated package, so the empty result is an answer and
      # not a broken query); @latest is 0.7.0, a healthy stable; and that stable
      # has SHIPPED, so nothing is blocked. Per the family rule — generalise the
      # comment to the rule, do not extend the enumeration — the condition was
      # replaced with the reason, which cannot expire.
      #
      # Ported from noy-db-ui#22 via klum-db#81 / noy-db#1003; mechanism is
      # identical so all four repos behave the same.
      #
      # Only this direction is blocked: a STABLE version published to @next is
      # harmless and recoverable, so it stays allowed.
      - name: Refuse a semver pre-release routed to @latest
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if [ "${{ github.event.release.prerelease }}" != "true" ] && [ "${VERSION#*-}" != "$VERSION" ]; then
            echo "::error::$VERSION is a semver pre-release, but this Release is not marked as a pre-release."
            echo "::error::Publishing would route it to @latest, the default install for every consumer who types no tag."
            echo "::error::Tick 'Set as a pre-release' on the Release and re-run."
            exit 1
          fi
          echo "✅ routing check passed (version=$VERSION, prerelease=${{ github.event.release.prerelease }})"

  # ── Gate 1b: the declared peer range is TRUE at its floor ────────────
  #
  # `verify` above proves nothing about the peer range: every one of its gates
  # runs against the DEV PIN, so all of them stay green no matter how wrong the
  # range is. Only this job installs a different hub.
  #
  # It lives in its own workflow rather than as a step in `verify` on purpose —
  # `verify` carries a pnpm store cache, and peer-floor.yml deliberately has
  # none, with a comment explaining why. Inlining it would put that cache in
  # front of the guard and leave the reasoning stranded in a file that no
  # longer holds the check.
  #
  # `ref` must be passed: the called workflow would otherwise check out the
  # default branch and gate `main` instead of the tag being published.
  peer-floor:
    name: Peer floor
    if: github.event_name == 'release' || github.event.inputs.confirm == 'PUBLISH' || github.event_name == 'push'
    uses: ./.github/workflows/peer-floor.yml
    with:
      ref: ${{ github.event.release.tag_name || github.ref }}

  # ── Gate 2: publish with provenance ──────────────────────────────────
  #
  # Explicit event guard: publish only runs on:
  #   - a `release` event (someone created a GitHub Release), or
  #   - a `workflow_dispatch` with `confirm: PUBLISH` typed in.
  #
  # The `verify` job above also runs on `push` to main when this file
  # changes (so workflow edits get tested), but the publish step
  # MUST NOT run on that path — otherwise pushing a workflow edit
  # could auto-publish to npm without explicit confirmation.
  publish:
    name: Publish to npm
    needs: [verify, peer-floor]
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'PUBLISH')
    runs-on: ubuntu-latest
    outputs:
      dist_tag: ${{ steps.dist_tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write   # required for npm --provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Resolve the npm dist-tag for this run. Computed once + echoed
      # to the run summary so an unintended target shows up before any
      # publish runs. Allowlist guards against typos in workflow_dispatch
      # input — the publish step refuses to run with an unknown tag.
      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              TAG="next"
              REASON="release event, prerelease=true"
            else
              TAG="latest"
              REASON="release event, prerelease=false"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            REASON="workflow_dispatch tag input"
          else
            TAG="latest"
            REASON="default"
          fi

          case "$TAG" in
            latest|next|canary|rc|beta|alpha) ;;
            *)
              echo "❌ Refusing to publish: tag '$TAG' is not in the allowlist (latest|next|canary|rc|beta|alpha)."
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### npm dist-tag" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason:** $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TAG" = "latest" ]; then
            echo "Consumers run \`pnpm add @noy-db/at-env\` (default install)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Consumers run \`pnpm add @noy-db/at-env@$TAG\` (opt-in channel)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Check which npm account the token belongs to. If this step fails,
      # the token is invalid; if it shows the wrong user, the user's account
      # doesn't own @noy-db/*.
      - name: Check npm auth (whoami)
        run: |
          WHOAMI=$(npm whoami 2>&1) && echo "npm user: $WHOAMI" || echo "npm whoami failed: $WHOAMI"
          echo "npm user: ${WHOAMI:-failed}" >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      # Recursive publish over all @noy-db/at-* stores. `--no-git-checks`
      # because the publish job checks out a tag, not a branch — pnpm's
      # default branch-clean check would fail otherwise. `--provenance`
      # requires id-token: write (granted on the job above). pnpm skips a
      # version already on the registry, so re-runs are safe.
      - name: Publish stores
        run: |
          set -o pipefail
          echo "Publishing @noy-db/at-* with --tag ${{ steps.dist_tag.outputs.tag }}"
          pnpm -r publish \
            --access public \
            --tag '${{ steps.dist_tag.outputs.tag }}' \
            --no-git-checks \
            --provenance 2>&1 | tee /tmp/publish.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "### Publish failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/publish.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$EXIT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summarise
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`${{ github.event.release.tag_name || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm dist-tag: \`${{ steps.dist_tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provenance: enabled (look for the ✓ on https://www.npmjs.com/package/@noy-db/at-env)" >> "$GITHUB_STEP_SUMMARY"

  # ── Align dist-tags after a STABLE publish ───────────────────────────
  #
  # `release.yml` routes an unmarked Release to `--tag latest`, which sets
  # `latest` to the stable and LEAVES `next` on the last pre-release. Since
  # `0.6.0 > 0.6.0-pre.7`, `@next` then sits BEHIND `@latest` — the "lying tag"
  # state the family sweep flags, created by the act of cutting a stable.
  #
  # Pointing `next` at the stable too is self-correcting: the next pre-release
  # moves it forward and the normal invariant returns.
  #
  # NOT continue-on-error, deliberately, and unlike the docs bridge. That job is
  # non-fatal because a missing payload is recoverable and must not fail a
  # publish that already succeeded. This one is different: a package left behind
  # makes `npm i @noy-db/at-x@next` resolve something OLDER than `@latest` — a
  # wrong answer, not a missing nicety. It must be loud.
  #
  # Only fires when the publish actually routed to `latest`.
  align-dist-tags:
    name: Align dist-tags (stable only)
    needs: publish
    if: github.event_name == 'release' && needs.publish.outputs.dist_tag == 'latest'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Show the plan
        run: node scripts/align-dist-tags.mjs --version="${GITHUB_REF_NAME#v}" --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Align `next` onto the stable
        run: node scripts/align-dist-tags.mjs --version="${GITHUB_REF_NAME#v}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Report failure loudly
        if: failure()
        run: |
          {
            echo "### ⚠️ dist-tag alignment FAILED — the publish itself succeeded"
            echo ""
            echo "The script's own log distinguishes two cases and they need OPPOSITE actions."
            echo "Read it before touching anything:"
            echo ""
            echo "- **\`dist-tag add\` FAILED** — those packages genuinely need repair, and the"
            echo "  log lists the exact command per package."
            echo "- **refused on the before-state** — \`latest\` was not the expected version, so"
            echo "  nothing was written. Do NOT hand-repair; check that the stable actually"
            echo "  published and that the version passed in was right."
            echo ""
            echo "A package written-but-unconfirmed is NOT a failure and does not reach this"
            echo "block — \`npm view\` is CDN-served and lags writes. Repairing one of those"
            echo "hand-edits a correct release."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Docs bridge: REMOVED, deliberately ──────────────────────────────
  #
  # This repo carried a `docs-bridge` job ported from noy-db-to. It could never
  # have run: it invoked `scripts/docs-bridge/build-payload.mjs` and
  # `scripts/__tests__/docs-bridge-capabilities.test.ts`, NEITHER OF WHICH WAS
  # EVER EXTRACTED into this repo. Because the job was `continue-on-error: true`,
  # a release would have published, the job would have died at "Build payload",
  # and THE RUN WOULD STILL HAVE REPORTED GREEN — producing neither half of the
  # documented proof pair (payload asset attached AND doc-sync issue filed in
  # noy-db-docs). All three extracted repos shipped this same dead job.
  #
  # Porting the scripts was NOT the fix. noy-db-to's build-payload.mjs filters
  # `d.name.startsWith('to-')` by design, to protect producer parity with the
  # other bridge consumer. On this repo that filter matches nothing, the job's
  # own `!p.packages.length` guard exits 1, and a verbatim port would only trade
  # a job that fails GREEN for one that fails RED while still never notifying
  # docs.
  #
  # The payload half exists to carry a semantic delta and has not once delivered
  # one on this family's record — three distinct failure shapes in three
  # releases (SILENT, MISLEADING, COMPLETE-AND-EMPTY). What noy-db-docs actually
  # consumes is the ISSUE BODY, where the package list lives and where its pin
  # check reads. So the replacement is a direct `gh issue create`, with no
  # payload schema and no scripts/ directory: this repo publishes no stores, so
  # the producer-parity constraint that makes widening the real bridge unsafe
  # does not apply here.
  #
  # ⚠️ NOT YET WIRED. Writing an issue into noy-db-docs needs a token scoped
  # there and their agreement, and that is a cross-repo decision they have not
  # been part of. Until then the honest state is the job ABSENT rather than
  # failing green: noy-db-docs has a documented fallback for the no-issue case
  # and has exercised it repeatedly. An absent mechanism people know about beats
  # a present one that lies.
  #
  # And deliberately NOT the cheap version — an echo in the run summary saying
  # "file the doc-sync by hand" is a person standing in for a mechanism, which
  # this family already knows does not survive the release where nobody looks.
