name: CI

# Standard CI for noy-db-at: the @noy-db/at-* sealing-key providers.
# Multi-package pnpm workspace: check:architecture → install → build → lint → typecheck → test
# across the runtime-supported Node versions (22 + 24).

on:
  push:
    branches: [main]
  # NO branches: filter here, deliberately. `pull_request: branches:` matches the
  # BASE branch, so a PR stacked on a feature branch triggers nothing and GitHub
  # reports "no checks reported" — which renders as pending and is actually
  # never-ran. Ask what green would look like if the check had not run; if that is
  # identical to what you see, it is not evidence. (noy-db-docs hit this on a
  # stacked PR whose green came from a hand dispatch.) `push:` stays filtered to
  # main so branch pushes do not duplicate the PR run.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint + typecheck ─────────────────────────────────────────────────
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Architecture invariants
        run: pnpm check:architecture

      # The doc-sync payload builder's own tests. They run under `node --test`,
      # not vitest, so they are invisible to `pnpm test` — this repo's
      # vitest.config.ts globs at-* projects only, and a test file under
      # scripts/ would sit in the tree and never run. Wired explicitly here so
      # that cannot happen silently.
      - name: Doc-sync payload builder
        run: pnpm check:docs-bridge
      # Catches a dependency a package USES but never DECLARES. The test suite
      # cannot: a sibling declaring it satisfies pnpm's store, so the suite goes
      # green either way (measured). Only a static check sees it.
      - name: Every package declares what it uses
        run: pnpm check:declared-deps
      # This repo publishes as ONE version line and has no changesets, so
      # nothing computes a dependency closure — `pnpm version:set` moves every
      # package at once. What that cannot guarantee is that it RAN everywhere.
      # A partial bump is silent: it builds, typechecks and tests green, and
      # surfaces only at publish time. Stated as an invariant (all versions are
      # equal) rather than a pinned string, so it is not edited every release.
      #
      # NOTE the sibling gate `check:not-already-published` is deliberately NOT
      # here. Between releases a repo's current version IS published, so on a
      # PR it would be correctly and permanently red. It runs on the release
      # path, where "am I about to publish a taken version" is the live
      # decision — see release.yml.
      - name: One version line across the workspace
        run: pnpm check:versions-uniform
      # This repo answers for the codemod rows naming ITS packages. hub shipped
      # them and can no longer check them — the packages moved here, so the
      # obligation did too. Nothing compiles a migration map.
      - name: Codemod rows agree with this repo's source
        run: pnpm check:codemod-rows
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  # ── Build (once) ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  # ── Test matrix (runtime-supported Node versions) ────────────────────
  test:
    name: Test (node ${{ matrix.node }})
    needs: [quality, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ matrix.node }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node${{ matrix.node }}-pnpm-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
